    broker_fields:
      token: security_id
      broker_symbol: custom_symbol
      lot_size: lot_units
      tick_size:
        column: tick_size
        transform: divide_by_100

  - segment: bse_equity_index_options
    exchange: bse
    shape: option
    rules:
      - match:
          exch: BSE
          segment: D
          sem_exch_instrument_type: OPTIDX
    identity:
      underlying_symbol:
        column: trading_symbol
        transform: underlying_before_first_hyphen
      expiry_date:
        column: expiry_date
        transform: month_day_year_time
      strike_price: strike_price
      option_type: option_type
    broker_fields:
      token: security_id
      broker_symbol: custom_symbol
      lot_size: lot_units
      tick_size:
        column: tick_size
        transform: divide_by_100

  - segment: nse_mutual_funds
    exchange: nse
    shape: security
    rules:
      - match:
          exch: NSE
          segment: E
          instrument_name: EQUITY
          sem_exch_instrument_type: MF
      - match:
          exch: NSE
          segment: E
          instrument_name: EQUITY
          sem_exch_instrument_type: Other
          series: SF
      - match:
          exch: NSE
          segment: E
          instrument_name: EQUITY
          sem_exch_instrument_type: ETF
          series: MF
    identity:
      symbol: trading_symbol
    broker_fields:
      token: security_id
      broker_symbol: symbol_name
      lot_size: lot_units
      tick_size:
        column: tick_size
        transform: divide_by_100

  - segment: nse_exchange_traded_funds
    exchange: nse
    shape: security
    rules: []
    identity:
