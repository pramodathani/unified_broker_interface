  - segment: nse_uncategorised
    exchange: nse
    shape: security
    rules: []
    identity:
      symbol: trading_symbol
    broker_fields:
      token: security_id
      broker_symbol: symbol_name
      lot_size: lot_units
      tick_size: tick_size

  - segment: bse_uncategorised
    exchange: bse
    shape: security
    rules: []
