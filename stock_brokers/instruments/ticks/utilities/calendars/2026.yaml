# Sessions on a day that would otherwise be closed. Every exchange announces Muhurat trading on
# Diwali, Sunday 2026-11-08, with its timings "to be notified subsequently" (BSE's currency segment
# holds it only for RFQ). Until the circular gives the hour, the whole day is accepted: a window too
# wide costs a few snapshot rows from brokers reconnecting that Sunday, while one too narrow would drop
# the session. Narrow `opens` and `closes` when the timings are published.
special_sessions:
  - date: 2026-11-08
    name: "Muhurat trading (timings to be notified)"
    exchanges: [nse, bse, mcx, ncdex]
    calendars: [equity, currency, commodity]
    opens: "09:00"
    closes: "23:59:59"
