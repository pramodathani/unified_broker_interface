# Trading holidays and special sessions for 2026, by exchange and calendar.
#
# Generated on 2026-09-13 from each exchange's own publication, not typed by hand:
#
#   nse    https://www.nseindia.com/api/holiday-master?type=trading - segments CM (equity; FO is
#          identical), CD (currency) and COM (commodity)
#   bse    https://www.bseindia.com/static/markets/marketinfo/listholi.aspx - Equity Segment and
#          Equity Derivative Segment; Currency Derivatives Segments; Commodity Derivatives Segment
#   mcx    https://www.mcxindia.com/market-operations/trading-surveillance/trading-holidays
#   ncdex  circular NCDEX/TRADING-040/2025 of 2025-12-16, https://www.ncdex.com/public/uploads/
#          circulars/Trading_holidays_for_the_calendar_year_2026_1765886308.pdf
#
# NSE and BSE agree date for date on all three calendars. MCX differs from them only on 2026-01-15,
# the Maharashtra municipal election, which NSE and BSE close for the commodity morning session and
# MCX does not list.
#
# A calendar is the set of segments that close together: `equity` is cash, indices and equity
# derivatives; `currency` is currency derivatives, which also close on bank holidays; `commodity` is
# commodity derivatives on every exchange. `closed` is `all`, or `morning` or `evening` for the
# commodity calendars, whose sessions are split at 17:00. Holidays falling on a Saturday or Sunday are
# listed as the exchanges list them; weekends are closed anyway.
#
# Exchanges revise these by circular during the year. A new year's file is added beside this one when
# the calendars are published, each December.

