site_name: Unified Broker Interface
site_description: One REST API over ten Indian stock brokers - quotes, candles, orders, positions and instrument masters, combined into one account.
site_author: Pramod Athani
copyright: Copyright &copy; Pramod Athani

theme:
  name: material
  language: en
  icon:
    logo: material/swap-horizontal-bold
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/vega@5
  - https://cdn.jsdelivr.net/npm/vega-lite@5
  - https://cdn.jsdelivr.net/npm/vega-embed@6

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: vegalite
          class: vegalite
          format: !!python/name:mkdocs_charts_plugin.fences.fence_vegalite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  - search
  - charts:
      vega_theme_light: default
      vega_theme_dark: dark
  - gen-files:
      scripts:
        - utilities/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            docstring_options:
              returns_named_value: false
              warn_unknown_params: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            show_if_no_docstring: false
            inherited_members: true
            members_order: source
            filters: ["!^_[^_]"]
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 96
            heading_level: 2

watch:
  - stock_brokers
  - unified_broker_interface
  - utilities

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Installation: get-started/installation.md
      - Configuration: get-started/configuration.md
      - First run: get-started/first-run.md
  - REST API:
      - rest-api/index.md
      - Session: rest-api/session.md
      - Users, brokers and exchanges: rest-api/details.md
      - Instruments: rest-api/instruments.md
      - Market quotes: rest-api/market-quotes.md
      - Historical data: rest-api/historical-data.md
      - Portfolio: rest-api/portfolio.md
      - Orders: rest-api/orders.md
      - Flatten everything: rest-api/flatten.md
      - Order engine: rest-api/order-engine.md
      - Synthetic orders: rest-api/synthetic-orders.md
      - Price and quantity references: rest-api/price-quantity-references.md
      - Constants: rest-api/constants.md
      - Errors and status codes: rest-api/errors.md
      - Test page: rest-api/test-page.md
  - Architecture:
      - architecture/index.md
      - Design choices: architecture/design-choices.md
      - Data contracts: architecture/contracts.md
      - Redis keys and streams: architecture/redis-keys.md
      - Database: architecture/database.md
      - Sessions and logins: architecture/sessions.md
  - Data pipelines:
      - pipelines/index.md
      - Market data: pipelines/market-data.md
      - Orders and positions: pipelines/orders-and-positions.md
      - Portfolio: pipelines/portfolio.md
      - Instrument masters and mapping: pipelines/instrument-masters.md
      - Price history: pipelines/price-history.md
  - Brokers: brokers/index.md
  - Operations:
      - operations/index.md
      - Services: operations/services.md
      - Daily schedule: operations/schedule.md
      - Scripts: operations/scripts.md
      - Offline tests: operations/tests.md
  - Project:
      - project/index.md
      - Repository structure: project/structure.md
      - Per-broker packages: project/per-broker-packages.md
      - Adding a broker: project/adding-a-broker.md
      - Writing these docs: project/writing-docs.md
  - Code reference: reference/
