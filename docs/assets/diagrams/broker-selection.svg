<svg class="ubi-svg" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="broker-selection-title broker-selection-description">
  <title id="broker-selection-title">The lowest-cost broker selector</title>
  <desc id="broker-selection-description">An F&amp;O order enters the lowest-cost selector, which holds the broker cost table in memory and reads every broker's counts from Redis in one command. Most orders go to the two brokers that charge nothing for F&amp;O. When their minutes fill, orders spill to the five-rupee broker, and only after that to the twenty-rupee brokers. The cost table is read from PostgreSQL once a day.</desc>
  <path id="broker-selection-free-a" class="wire" d="M150,210 L440,210 C500,210 500,80 560,80 L620,80"/>
  <path id="broker-selection-free-b" class="wire" d="M150,210 L440,210 C500,210 500,100 560,100 L620,100"/>
  <path id="broker-selection-five" class="wire" d="M150,210 L440,210 L560,210 L620,210"/>
  <path id="broker-selection-twenty" class="wire" d="M150,210 L440,210 C500,210 500,330 560,330 L620,330"/>
  <path id="broker-selection-table" class="wire" d="M325,70 L325,130"/>
  <path id="broker-selection-counts" class="wire" d="M325,350 L325,290"/>
  <circle class="dot" r="6">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#broker-selection-free-a"/></animateMotion>
  </circle>
  <circle class="dot" r="6">
    <animateMotion dur="4s" repeatCount="indefinite" begin="-1s"><mpath href="#broker-selection-free-b"/></animateMotion>
  </circle>
  <circle class="dot" r="6">
    <animateMotion dur="4s" repeatCount="indefinite" begin="-2s"><mpath href="#broker-selection-free-a"/></animateMotion>
  </circle>
  <circle class="dot" r="6">
    <animateMotion dur="8s" repeatCount="indefinite" begin="-3s" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#broker-selection-five"/></animateMotion>
  </circle>
  <circle class="dot alt" r="6">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0s"><mpath href="#broker-selection-counts"/></animateMotion>
  </circle>
  <circle class="dot alt" r="6">
    <animateMotion dur="8s" repeatCount="indefinite" begin="0s" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#broker-selection-table"/></animateMotion>
  </circle>
  <rect class="box" x="20" y="180" width="130" height="60" rx="8"/>
  <text class="title" x="85" y="206" text-anchor="middle">F&amp;O order</text>
  <text class="small" x="85" y="224" text-anchor="middle">no broker named</text>
  <rect class="store" x="210" y="20" width="230" height="50" rx="6"/>
  <text x="325" y="42" text-anchor="middle">broker cost table</text>
  <text class="mono" x="325" y="59" text-anchor="middle">unified.broker_order_costs</text>
  <text class="small" x="335" y="104">read at 06:00 IST</text>
  <rect class="accent-box" x="220" y="130" width="210" height="160" rx="8"/>
  <text class="title" x="325" y="170" text-anchor="middle">Lowest-cost selector</text>
  <text class="small" x="325" y="192" text-anchor="middle">1 blocked last</text>
  <text class="small" x="325" y="208" text-anchor="middle">2 cheapest fee</text>
  <text class="small" x="325" y="224" text-anchor="middle">3 least needed elsewhere</text>
  <text class="small" x="325" y="240" text-anchor="middle">4 least full</text>
  <text class="small" x="325" y="256" text-anchor="middle">5 rotation place</text>
  <rect class="store" x="210" y="350" width="230" height="50" rx="6"/>
  <text x="325" y="372" text-anchor="middle">Redis counts</text>
  <text class="mono" x="325" y="389" text-anchor="middle">rate windows, daily_count</text>
  <text class="small" x="335" y="324">one eval per order</text>
  <rect class="box" x="620" y="50" width="260" height="70" rx="8"/>
  <text class="title" x="634" y="76">₹0 for F&amp;O</text>
  <text class="small" x="634" y="96">Flattrade, Wisdom Capital</text>
  <text class="small" x="634" y="111">720 orders a minute between them</text>
  <rect class="box" x="620" y="180" width="260" height="60" rx="8"/>
  <text class="title" x="634" y="206">₹5 for F&amp;O</text>
  <text class="small" x="634" y="226">Shoonya, once the ₹0 minutes are full</text>
  <rect class="box" x="620" y="300" width="260" height="60" rx="8"/>
  <text class="title" x="634" y="326">₹20 for F&amp;O</text>
  <text class="small" x="634" y="346">the other seven, last</text>
</svg>
