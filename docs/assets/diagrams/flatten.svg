<svg class="ubi-svg" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flatten-title flatten-description">
  <title id="flatten-title">Flatten: cancel first, then close, then confirm</title>
  <desc id="flatten-description">The API sends a cancel for every open order to the broker holding it, then re-reads the brokers' order books in Redis every quarter second until the cancels are confirmed or the wait runs out. Only then does it send one market order per position to the broker that holds it, and it re-reads the brokers' positions every quarter second until every closed position shows zero or the wait runs out. It answers flat only when they all do.</desc>
  <rect class="box" x="20" y="165" width="130" height="50" rx="25"/>
  <text x="85" y="186" text-anchor="middle">Your program</text>
  <text class="mono" x="85" y="203" text-anchor="middle">confirm: FLATTEN</text>
  <path id="flatten-request" class="wire" d="M150,190 L250,190"/>
  <path id="flatten-answer" class="wire-solid" d="M250,190 L150,190" stroke-opacity="0"/>
  <text class="small" x="85" y="240" text-anchor="middle">5. answer: flat only</text>
  <text class="small" x="85" y="254" text-anchor="middle">if positions show zero</text>
  <rect class="accent-box" x="250" y="150" width="170" height="80" rx="8"/>
  <text class="title" x="335" y="178" text-anchor="middle">API worker</text>
  <text class="mono" x="335" y="198" text-anchor="middle">POST /api/orders/flatten</text>
  <text class="small" x="335" y="216" text-anchor="middle">KillSwitch decides</text>
  <rect class="store" x="235" y="290" width="200" height="80" rx="8"/>
  <text class="title" x="335" y="313" text-anchor="middle">Redis</text>
  <text class="mono" x="335" y="333" text-anchor="middle">&lt;broker&gt;:orders:orders</text>
  <text class="mono" x="335" y="351" text-anchor="middle">&lt;broker&gt;:portfolio:positions</text>
  <path id="flatten-poll" class="wire" d="M320,230 L320,290 M350,290 L350,230"/>
  <path id="flatten-poll-down" class="wire-solid" d="M320,230 L320,290" stroke-opacity="0"/>
  <path id="flatten-poll-up" class="wire-solid" d="M350,290 L350,230" stroke-opacity="0"/>
  <text class="small" x="450" y="304">2. wait for the cancels: re-read the</text>
  <text class="small" x="450" y="318">order books every 0.25 s</text>
  <text class="small" x="450" y="346">4. wait for the closes: re-read the</text>
  <text class="small" x="450" y="360">positions until each shows zero</text>
  <text class="mono" x="450" y="384">both waits: ORDER_FLATTEN_WAIT_SECONDS</text>
  <rect class="box" x="720" y="40" width="160" height="50" rx="6"/>
  <text x="800" y="62" text-anchor="middle">Broker A</text>
  <text class="small" x="800" y="79" text-anchor="middle">open stop, long position</text>
  <rect class="box" x="720" y="165" width="160" height="50" rx="6"/>
  <text x="800" y="187" text-anchor="middle">Broker B</text>
  <text class="small" x="800" y="204" text-anchor="middle">open target</text>
  <rect class="box" x="720" y="290" width="160" height="50" rx="6"/>
  <text x="800" y="312" text-anchor="middle">Broker C</text>
  <text class="small" x="800" y="329" text-anchor="middle">short position</text>
  <path id="flatten-cancel-a" class="wire" d="M420,170 C560,170 580,58 720,58"/>
  <path id="flatten-cancel-b" class="wire" d="M420,182 L720,182"/>
  <path id="flatten-close-a" class="wire" d="M420,200 C580,200 600,74 720,74"/>
  <path id="flatten-close-c" class="wire" d="M420,212 C580,212 600,315 720,315"/>
  <text class="small" x="440" y="100">1. cancels go out first</text>
  <text class="small" x="595" y="234">3. then one MARKET close</text>
  <text class="small" x="595" y="248">per position, same broker</text>
  <circle class="dot" r="6" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.08;1" calcMode="linear"><mpath href="#flatten-request"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.08;0.09;1"/>
  </circle>
  <circle class="dot" r="6" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.09;0.2;1" calcMode="linear"><mpath href="#flatten-cancel-a"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.09;0.1;0.2;0.21;1"/>
  </circle>
  <circle class="dot" r="6" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.11;0.2;1" calcMode="linear"><mpath href="#flatten-cancel-b"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.11;0.12;0.2;0.21;1"/>
  </circle>
  <circle class="dot alt" r="5" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;0;1;0;1;1" keyTimes="0;0.22;0.26;0.3;0.34;0.38;0.42;1" calcMode="linear"><mpath href="#flatten-poll-down"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.22;0.23;0.42;0.43;1"/>
  </circle>
  <circle class="dot alt" r="5" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;0;1;0;1;1" keyTimes="0;0.24;0.28;0.32;0.36;0.4;0.44;1" calcMode="linear"><mpath href="#flatten-poll-up"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.44;0.45;1"/>
  </circle>
  <circle class="dot ok" r="6" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.46;0.58;1" calcMode="linear"><mpath href="#flatten-close-a"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.46;0.47;0.58;0.59;1"/>
  </circle>
  <circle class="dot ok" r="6" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.48;0.6;1" calcMode="linear"><mpath href="#flatten-close-c"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.48;0.49;0.6;0.61;1"/>
  </circle>
  <circle class="dot alt" r="5" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;0;1;0;1;1" keyTimes="0;0.62;0.66;0.7;0.74;0.78;0.82;1" calcMode="linear"><mpath href="#flatten-poll-down"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.62;0.63;0.82;0.83;1"/>
  </circle>
  <circle class="dot alt" r="5" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;0;1;0;1;1" keyTimes="0;0.64;0.68;0.72;0.76;0.8;0.84;1" calcMode="linear"><mpath href="#flatten-poll-up"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.64;0.65;0.84;0.85;1"/>
  </circle>
  <circle class="dot" r="6" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.87;0.95;1" calcMode="linear"><mpath href="#flatten-answer"/></animateMotion>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.87;0.88;0.95;0.96;1"/>
  </circle>
</svg>
