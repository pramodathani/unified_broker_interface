<svg class="ubi-svg" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-description">
  <title id="overview-title">Ten brokers, one API</title>
  <desc id="overview-description">Market data, orders and positions flow from ten brokers into Redis and TimescaleDB, the unified layer combines them, and the REST API serves one view. An order travels the other way, from the API straight to one chosen broker.</desc>
  <text class="small" x="95" y="14" text-anchor="middle">broker scripts</text>
  <g>
    <rect class="box" x="20" y="22" width="150" height="26" rx="4"/><text x="95" y="40" text-anchor="middle">Dhan</text>
    <rect class="box" x="20" y="56" width="150" height="26" rx="4"/><text x="95" y="74" text-anchor="middle">Flattrade</text>
    <rect class="box" x="20" y="90" width="150" height="26" rx="4"/><text x="95" y="108" text-anchor="middle">Fyers</text>
    <rect class="box" x="20" y="124" width="150" height="26" rx="4"/><text x="95" y="142" text-anchor="middle">Groww</text>
    <rect class="box" x="20" y="158" width="150" height="26" rx="4"/><text x="95" y="176" text-anchor="middle">INDmoney</text>
    <rect class="box" x="20" y="192" width="150" height="26" rx="4"/><text x="95" y="210" text-anchor="middle">Kotak</text>
    <rect class="box" x="20" y="226" width="150" height="26" rx="4"/><text x="95" y="244" text-anchor="middle">Shoonya</text>
    <rect class="box" x="20" y="260" width="150" height="26" rx="4"/><text x="95" y="278" text-anchor="middle">Stoxkart</text>
    <rect class="box" x="20" y="294" width="150" height="26" rx="4"/><text x="95" y="312" text-anchor="middle">Wisdom Capital</text>
    <rect class="box" x="20" y="328" width="150" height="26" rx="4"/><text x="95" y="346" text-anchor="middle">Zerodha</text>
  </g>
  <path id="overview-dhan" class="wire" d="M170,35 C215,35 215,140 260,140"/>
  <path id="overview-flattrade" class="wire" d="M170,69 C215,69 215,140 260,140"/>
  <path id="overview-fyers" class="wire" d="M170,103 C215,103 215,140 260,140"/>
  <path id="overview-groww" class="wire" d="M170,137 C215,137 215,140 260,140"/>
  <path id="overview-indmoney" class="wire" d="M170,171 C215,171 215,140 260,140"/>
  <path id="overview-kotak" class="wire" d="M170,205 C215,205 215,140 260,140"/>
  <path id="overview-shoonya" class="wire" d="M170,239 C215,239 215,140 260,140"/>
  <path id="overview-stoxkart" class="wire" d="M170,273 C215,273 215,140 260,140"/>
  <path id="overview-wisdom" class="wire" d="M170,307 C215,307 215,140 260,140"/>
  <path id="overview-zerodha" class="wire" d="M170,341 C215,341 215,140 260,140"/>
  <rect class="store" x="260" y="110" width="150" height="60" rx="8"/>
  <text class="title" x="335" y="136" text-anchor="middle">Redis</text>
  <text class="small" x="335" y="155" text-anchor="middle">hashes and streams</text>
  <path id="overview-persist" class="wire" d="M335,170 L335,230"/>
  <text class="small" x="342" y="204">persist</text>
  <rect class="store" x="260" y="230" width="150" height="60" rx="8"/>
  <text class="title" x="335" y="256" text-anchor="middle">TimescaleDB</text>
  <text class="small" x="335" y="275" text-anchor="middle">one schema per broker</text>
  <path id="overview-combine" class="wire" d="M410,140 L480,140"/>
  <rect class="box" x="480" y="100" width="170" height="80" rx="8"/>
  <text class="title" x="565" y="128" text-anchor="middle">Unified layer</text>
  <text class="small" x="565" y="148" text-anchor="middle">bin/unified/* combines</text>
  <text class="small" x="565" y="164" text-anchor="middle">every broker into one view</text>
  <path id="overview-serve" class="wire" d="M650,140 L700,140"/>
  <rect class="accent-box" x="700" y="100" width="180" height="80" rx="8"/>
  <text class="title" x="790" y="128" text-anchor="middle">REST API</text>
  <text class="mono" x="790" y="148" text-anchor="middle">/api/…  26 routes</text>
  <text class="small" x="790" y="164" text-anchor="middle">one account, one token</text>
  <path id="overview-client" class="wire" d="M790,100 L790,50"/>
  <rect class="box" x="720" y="14" width="140" height="36" rx="18"/>
  <text x="790" y="37" text-anchor="middle">Your program</text>
  <path id="overview-order" class="wire-solid" d="M760,180 C760,340 420,341 170,341" stroke-dasharray="2 3"/>
  <text class="small" x="470" y="330">an order goes straight to one chosen broker</text>
  <circle class="dot" r="5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#overview-dhan"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="2.4s" begin="-0.5s" repeatCount="indefinite"><mpath href="#overview-groww"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="2.4s" begin="-1.1s" repeatCount="indefinite"><mpath href="#overview-shoonya"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite"><mpath href="#overview-zerodha"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite"><mpath href="#overview-fyers"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="2.4s" begin="-1.9s" repeatCount="indefinite"><mpath href="#overview-wisdom"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#overview-persist"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="1s" repeatCount="indefinite"><mpath href="#overview-combine"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="0.9s" begin="-0.3s" repeatCount="indefinite"><mpath href="#overview-serve"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="0.9s" begin="-0.6s" repeatCount="indefinite"><mpath href="#overview-client"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#overview-order"/></animateMotion></circle>
</svg>
